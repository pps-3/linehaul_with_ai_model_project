server.port=${PORT:8080}

spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

logging.level.org.mongodb.driver=warn
logging.level.com.example.linehaul=info

# --- Groq (AI chat assistant) -------------------------------------------
# Get a free API key at https://console.groq.com -> API Keys.
# NEVER hardcode the real key here - set it as an environment variable
# named GROQ_API_KEY on your machine / hosting platform instead.
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
# openai/gpt-oss-20b is fast and cheap; use openai/gpt-oss-120b for better
# reasoning quality. Check https://console.groq.com/docs/models for the
# current catalog - Groq periodically retires older model IDs.
groq.model=${GROQ_MODE:openai/gpt-oss-20b}
groq.temperature=0.2
groq.max-tokens=700
groq.connect-timeout-ms=5000
groq.read-timeout-ms=20000

